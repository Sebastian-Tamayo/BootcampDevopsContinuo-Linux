# Lemoncode Challenge - Orquestación completa (Mongo + Backend + Frontend)
# Uso: docker compose up --build
# Parar: docker compose down
# Logs: docker compose logs -f
# Estado: docker compose ps

services:
  # --- Base de datos ---
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      # Persistencia: los datos sobreviven a docker compose down
      - mongo-data:/data/db
    networks:
      - lemoncode-network

  # --- API Express ---
  topics-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: topics-api
    container_name: topics-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Dentro de la red Docker, el host es el nombre del servicio (mongo)
      DATABASE_URL: mongodb://admin:password@mongo:27017/?authSource=admin
      DATABASE_NAME: LemoncodeCourseDb
      HOST: "0.0.0.0"
      PORT: "5000"
    depends_on:
      - mongo
    networks:
      - lemoncode-network

  # --- Frontend (SSR Node + EJS) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: lemoncode-frontend
    container_name: lemoncode-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # El fetch ocurre en el servidor del frontend → usa DNS Docker
      API_URL: http://topics-api:5000/api/classes
    depends_on:
      - topics-api
    networks:
      - lemoncode-network

networks:
  lemoncode-network:
    name: lemoncode-network
    driver: bridge

volumes:
  mongo-data:
    name: mongo-data
